version: '3.8'

services:
  # PHP应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zbuilder-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_DRIVER=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=zbuilder
      - DB_USER=zbuilder
      - DB_PASS=zbuilder123
      - DB_CHARSET=utf8mb4
      - JWT_KEY=your_jwt_secret_key_here
      - APP_KEY=your_app_secret_key_here
    volumes:
      - .:/var/www/html
      - ./runtime:/var/www/html/runtime
    depends_on:
      - db
    networks:
      - zbuilder-network

  # MySQL数据库服务
  db:
    image: mysql:8.0
    container_name: zbuilder-db
    restart: always
    environment:
      MYSQL_DATABASE: zbuilder
      MYSQL_USER: zbuilder
      MYSQL_PASSWORD: zbuilder123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - zbuilder-network

  # Redis缓存服务
  redis:
    image: redis:6-alpine
    container_name: zbuilder-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zbuilder-network

  # Nginx Web服务器
  nginx:
    image: nginx:alpine
    container_name: zbuilder-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/sites-available/
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
      - ./docker/nginx/logs/:/var/log/nginx/
    depends_on:
      - app
    networks:
      - zbuilder-network

networks:
  zbuilder-network:
    driver: bridge

volumes:
  db_data:
  redis_data: