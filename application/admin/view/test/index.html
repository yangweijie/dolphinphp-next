<script>
    // 侧边栏切换
    function toggleAside() {
        const aside = document.querySelector('.aside-builder');
        const mainContent = document.querySelector('.main-content');

        if (aside.style.display === 'none') {
            aside.style.display = 'block';
            mainContent.style.marginRight = '320px';
        } else {
            aside.style.display = 'none';
            mainContent.style.marginRight = '0';
        }
    }

    // HTMX事件监听
    document.body.addEventListener('htmx:configRequest', function(evt) {
        // 添加CSRF token等
        console.log('HTMX请求配置:', evt.detail);
    });

    document.body.addEventListener('htmx:afterRequest', function(evt) {
        console.log('HTMX请求完成:', evt.detail);

        // 如果是删除操作成功，刷新表格
        if (evt.detail.xhr.status === 200 && evt.detail.requestConfig.verb === 'delete') {
            const response = JSON.parse(evt.detail.xhr.responseText);
            if (response.code === 1) {
                // 重新加载表格
                htmx.ajax('GET', '{:url("index")}', '#user-table-container');
                alert(response.msg);
            } else {
                alert(response.msg);
            }
        }
    });

    // 表单提交处理
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.requestConfig.verb === 'post') {
            const response = JSON.parse(evt.detail.xhr.responseText);
            if (response.code === 1) {
                alert('保存成功！');
                evt.target.reset(); // 重置表单
            } else {
                alert('保存失败：' + response.msg);
            }
        }
    });
</script>
